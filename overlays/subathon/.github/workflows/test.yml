name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install the incentives module
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check widget/ is up to date with its sources
        run: git diff --exit-code -- widget
