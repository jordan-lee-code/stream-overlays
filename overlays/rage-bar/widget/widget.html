<div id="rage-app">
  <div id="rage-card" class="rage-card" aria-live="polite">
    <div class="rage-head">
      <span id="rage-title" class="rage-title">THE BAR</span>
      <span id="rage-timer" class="rage-timer" hidden></span>
    </div>
    <div class="rage-track">
      <div id="rage-fill" class="rage-fill"></div>
    </div>
    <div class="rage-foot">
      <span id="rage-readout" class="rage-readout">0 / 100</span>
      <span id="rage-note" class="rage-note" hidden></span>
    </div>
    <span id="rage-lock" class="rage-lock" title="The bar is locked" hidden></span>
  </div>
  <div id="rage-float" class="rage-float" aria-hidden="true" hidden></div>
</div>
