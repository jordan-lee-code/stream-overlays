name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Build the overlay import file
        run: npm run build
      - name: Check the built file is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dist/incentives.overlay.json','utf8'))"
