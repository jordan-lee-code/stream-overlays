<div id="uc-root">
  <div id="uc-col" class="uc-col">
    <!-- The window the webcam sits in. This widget is behind the camera, so the window is empty, and the ring around it is the frame. -->
    <div id="uc-win" class="uc-win"><div id="uc-ring" class="uc-ring"></div></div>
    <div id="uc-app" class="uc-app">
      <div class="uc-head"><span id="uc-name" class="uc-name"></span><span id="uc-pron" class="uc-pron" hidden></span></div>
      <div id="uc-tagline" class="uc-tagline" hidden></div>
      <div id="uc-line" class="uc-line" hidden></div>
    </div>
  </div>
</div>
