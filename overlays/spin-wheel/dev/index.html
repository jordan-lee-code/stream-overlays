<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinning Wheel, local dev harness</title>
  <link rel="stylesheet" href="../widget/widget.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: "Quicksand", "Segoe UI", sans-serif; }
    body { background: #e9edf2; color: #2b2f36; }

    #layout { display: flex; min-height: 100vh; align-items: stretch; }

    /* OBS-style transparency check so the widget's own colours read true. */
    #stage-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #cfd6dd;
      background-image:
        linear-gradient(45deg, #c2cad2 25%, transparent 25%, transparent 75%, #c2cad2 75%),
        linear-gradient(45deg, #c2cad2 25%, transparent 25%, transparent 75%, #c2cad2 75%);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      padding: 20px;
    }
    /* Give the widget a fixed box to fill (it now sizes to its container). */
    #stage { width: 760px; height: 760px; max-width: 92vw; }

    #controls {
      width: 360px;
      flex: 0 0 360px;
      background: #ffffff;
      border-left: 1px solid #d4dae1;
      padding: 18px;
      overflow-y: auto;
      box-shadow: -4px 0 18px rgba(0,0,0,0.06);
    }
    #controls h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #7c8794; margin: 22px 0 8px; }
    #controls h2:first-child { margin-top: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
    .row label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
    input[type="text"], input[type="number"], select {
      font: inherit; padding: 7px 9px; border: 1px solid #ccd3da; border-radius: 8px; background: #fff;
    }
    input#chat-text { flex: 1; min-width: 140px; }
    input#chat-user { width: 120px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; padding: 8px 12px;
      border: none; border-radius: 8px; background: #5a6b7b; color: #fff;
    }
    button:hover { background: #46566a; }
    button.alt { background: #e3e8ee; color: #2b2f36; }
    button.alt:hover { background: #d3dae2; }
    button.go { background: #e8755a; }
    button.go:hover { background: #d8634a; }
    .hint { font-size: 12px; color: #8a949f; margin: 2px 0 10px; line-height: 1.4; }
    .divider { height: 1px; background: #e6eaef; margin: 14px 0; }
    #all-settings details { border: 1px solid #e1e6ec; border-radius: 8px; margin-bottom: 6px; }
    #all-settings summary { cursor: pointer; font-weight: 600; font-size: 13px; padding: 8px 10px; }
    #all-settings .field { padding: 6px 10px; border-top: 1px solid #eef1f5; display: flex; flex-direction: column; gap: 3px; }
    #all-settings .field label { font-size: 12px; color: #5b6671; line-height: 1.3; }
    #all-settings .field.check { flex-direction: row; align-items: flex-start; gap: 6px; }
    #all-settings .field input[type="text"], #all-settings .field input[type="number"], #all-settings .field select { width: 100%; }
    #all-settings .field input[type="color"] { width: 48px; height: 28px; padding: 0; border: 1px solid #ccd3da; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="stage-wrap"><div id="stage"></div></div>
    <div id="controls"></div>
  </div>
  <script src="copy-panel.js"></script>
  <script src="harness.js"></script>
  <!-- Ko-fi support button. It is part of this local dev page only, not the widget, so it never appears on stream. -->
  <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
  <script>
    if (window.kofiWidgetOverlay) {
      kofiWidgetOverlay.draw('journeyingjordan', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Support me',
        'floating-chat.donateButton.background-color': '#ff38b8',
        'floating-chat.donateButton.text-color': '#fff'
      });
    }
  </script>
</body>
</html>
