<div id="np-root">
  <!-- The card starts out hidden, and is shown once there is a track to show and the saved on or off state is known. -->
  <div id="np-app" class="np-card gone">
    <div id="np-art-wrap" class="np-art-wrap" hidden><img id="np-art" class="np-art" alt="" referrerpolicy="no-referrer"></div>
    <div class="np-body">
      <div id="np-label" class="np-label" hidden></div>
      <div id="np-title" class="np-title"></div>
      <div id="np-artist" class="np-artist" hidden></div>
      <div id="np-album" class="np-album" hidden></div>
      <div id="np-progress" class="np-progress" hidden>
        <span id="np-pos" class="np-time"></span>
        <div class="np-track"><div id="np-fill" class="np-fill"></div></div>
        <span id="np-dur" class="np-time"></span>
      </div>
      <div id="np-note" class="np-note" hidden></div>
    </div>
  </div>
</div>
